# Projects hub cards (/projects/).
# Add an entry here and a card appears — no template edits needed.
#
#   title:      card heading
#   url:        where the card links (internal path or full URL)
#   summary:    one or two lines, scannable, not long-form
#   image:      optional thumbnail under /assets/projects/.
#               MUST be 16:9 (800x450). The card box is 16:9 with
#               object-fit:cover, so any other ratio gets crop-zoomed by the
#               browser and sits visibly tighter than its neighbours.
#                 crop:  sips -c 450 800 src.jpg --out out.jpg
#                 pad:   sips -p H W --padColor FFFFFF src.jpg --out out.jpg
#               Crop single-subject photos; pad multi-panel composites, where a
#               crop would delete a panel.
#   meta:       optional small label (year, status, stack)
#   collection: optional collection name — the card shows a live item count
#               instead of `meta` (used by Teardowns)

